# Nginx configuration for Lua examples
# Compatible with standard Nginx (with lua module) and OpenResty
#
# Usage:
#   nginx -c $(pwd)/conf/nginx.conf
#
# Adjust paths below to match your installation and script location

pid         logs/nginx.pid;
error_log   logs/nginx-error.log debug;

# Development settings
master_process      off;
daemon              off;
worker_rlimit_core  500M;
working_directory   /tmp;

worker_processes    2;

events {
    worker_connections  1024;
    use                 epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    logs/nginx-access.log;
    sendfile      on;
    
    # Set Lua package path for module loading
    lua_package_path '$(pwd)/lib/?/init.lua;$(pwd)/lib/?.lua;;';
    
    # Shared memory zones for Lua
    lua_shared_dict rate_limit 10m;
    
    server {
        listen           127.0.0.1:80;
        server_name      localhost;
        
        # Default error page
        error_page 401 /unauthorized.html;
        error_page 403 /forbidden.html;
        error_page 404 /not_found.html;
        error_page 503 /unavailable.html;
        
        # Static files location
        location / {
            root   html;
            index  index.html;
        }
        
        # Rate limiting (access phase)
        location /protected {
            access_by_lua_file $(pwd)/lib/handlers/limit.lua;
            echo "Access granted";
        }
        
        # Data operations (requires authentication)
        location ~ ^/(save|read)/ {
            lua_need_request_body on;
            access_by_lua_file $(pwd)/lib/handlers/auth.lua;
            content_by_lua_file $(pwd)/lib/handlers/data.lua;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK";
        }
        
        # Test recursive location capture
        location /test/recursive {
            content_by_lua_block {
                local num = tonumber(ngx.var.arg_num) or 0
                if num > 10 then
                    ngx.say("num too large")
                    return
                end
                if num > 0 then
                    local res = ngx.location.capture("/test/recursive?num=" .. tostring(num - 1))
                    ngx.print("Depth " .. num .. " -> " .. res.body)
                else
                    ngx.say("Finished")
                end
            }
        }
    }
}
